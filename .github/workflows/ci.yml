name: CI

on: 
  workflow_dispatch:
  push:
    branches: main
  pull_request: 
    branches: main

jobs:
  build:
    name: Bygg och Testa
    runs-on: ubuntu-latest
    env:
        BUILD_CONFIGURATION: "Release"
    outputs:
      antal_rader: ${{ steps.rakna_rader.outputs.antal_rader }}
    steps:
      - uses: actions/checkout@v7
      - name: Räkna antal rader C#-kod
        id: rakna_rader
        run: echo "antal_rader=$(find . -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' | xargs cat | wc -l)" >> $GITHUB_OUTPUT
      - name: build-and-test
        run: echo "Bygg och testa"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: restore
        run: dotnet restore
      - name: build 
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: test
        run: dotnet test --no-build --configuration ${{ env.BUILD_CONFIGURATION }}
        
  github_context:    
      name: Github context
      runs-on: ubuntu-latest
      env: 
        STARTED_BY: ${{ github.actor }}
        ACTION: ${{ github.event_name }}
        BRANCH: ${{ github.ref_name }}
      steps:
        - name: dump github context
          run: |
            echo "Startad av $STARTED_BY — händelse: $ACTION — gren: $BRANCH"
            echo "Startad av $STARTED_BY — händelse: $ACTION — gren: $BRANCH" > $GITHUB_STEP_SUMMARY
            
  discord_notifier:
    name: Discord notiser
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skicka CI status till Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTAL_RADER_KOD: ${{ needs.build.outputs.antal_rader }}
          STATUS: ${{ needs.build.result == 'success' && 'Körningen lyckades' || 'Körningen misslyckades, se PR för mer information' }}
        run: |
          curl -sf -H "Content-Type: application/json" \
            -d "{\"content\": \"$STATUS - $ANTAL_RADER_KOD rader av C#-kod\"}" "$WEBHOOK"


  pr_notifier:
    name: Notifiera ny PR
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Skicka PR notifikation till Discord
        env:
         WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
         SKAPAD_AV: ${{ github.event.pull_request.user.login }}
         PR_NUMMER: ${{ github.event.pull_request.number }}
         PR_LINK: ${{ github.event.pull_request.html_url }}
        run: |
           curl -sf -H "Content-Type: application/json" \
             -d "{\"content\": \"$SKAPAD_AV har skapat PR #$PR_NUMMER: $PR_LINK\"}" "$WEBHOOK"
    
     
    
        
          
